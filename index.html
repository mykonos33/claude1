<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!--ARTIFACT-HEAD-START-->
<title>오목눈이 아이스크림 대결</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  /* layout: 고정 크기 무대(가로 1200×760 / 세로 760×1200)를 화면에 맞게 확대·축소, 화면 전환은 무대 안에서 */
  --bg:#FFF2F0;
  --paper:#FFFFFF;
  --pink:#F7A8C0;
  --pink-deep:#E2719A;
  --berry:#B9406B;
  --ink:#4A3833;
  --ink-soft:#8A7670;
  --line:#F3D9E2;
  --mint:#9FDCC6;
  --sky:#D9EEFF;
  --butter:#FFE08A;
  --gold:#F5B83D;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

#wrap{position:fixed;inset:0;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(circle at 24px 24px,rgba(226,113,154,.12) 5px,transparent 6px) 0 0/56px 56px,var(--bg)}
#view{position:relative;width:100%;height:100%}
#stage{position:absolute;left:50%;top:50%;width:1200px;height:760px;transform-origin:center center;border-radius:36px;overflow:hidden;
  background:radial-gradient(circle at 30px 30px,rgba(247,168,192,.22) 6px,transparent 7px) 0 0/60px 60px,linear-gradient(#FFF0F4,#FFF8EE);
  box-shadow:0 12px 40px rgba(185,64,107,.16)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;box-sizing:border-box;padding:28px}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-size:30px;color:#fff;background:var(--pink-deep);border:0;border-radius:999px;padding:14px 38px;cursor:pointer;
  box-shadow:0 7px 0 var(--berry),0 12px 22px rgba(185,64,107,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--berry)}
.btn.big{font-size:40px;padding:18px 64px}
.btn.sub{background:var(--paper);color:var(--berry);box-shadow:0 7px 0 var(--line),0 12px 22px rgba(185,64,107,.12)}
.btn.sub:active{box-shadow:0 2px 0 var(--line)}
.btn:disabled{background:#E7D6DB;box-shadow:0 7px 0 #D3BEC5;cursor:default}
.corner{position:absolute;top:18px;right:18px;display:flex;gap:10px;z-index:40}
.icon-btn{width:56px;height:56px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 4px 0 var(--line);cursor:pointer;display:grid;place-items:center;padding:0}
.icon-btn svg{width:28px;height:28px}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}

/* ---------- title ---------- */
.logo{text-align:center;position:relative;z-index:2}
.logo small{display:block;font-family:var(--f-display);font-size:30px;color:var(--pink-deep);letter-spacing:.06em}
.logo h1{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:84px;line-height:1.05;color:var(--berry);text-wrap:balance;
  text-shadow:0 5px 0 #fff,0 9px 0 var(--line)}
.title-girls{display:flex;align-items:flex-end;gap:26px;position:relative;z-index:2}
.title-girls .tg{width:190px}
.title-girls .tg svg{width:100%;display:block}
.vs{font-family:var(--f-display);font-size:54px;color:#fff;background:var(--gold);border-radius:50%;width:92px;height:92px;display:grid;place-items:center;margin-bottom:60px;box-shadow:0 6px 0 #D89A23}
.record{font-family:var(--f-display);font-size:22px;color:var(--ink-soft)}
.float-birds{position:absolute;inset:0;pointer-events:none}
.float-birds div{position:absolute;width:110px;animation:bob 2.6s ease-in-out infinite}
.float-birds svg{width:100%;display:block}

/* ---------- select ---------- */
.scr-h{margin:0;font-family:var(--f-display);font-weight:400;font-size:48px;color:var(--berry);text-wrap:balance;text-align:center}
.pick-row{display:flex;gap:30px}
.pick{width:330px;border:5px solid var(--line);background:var(--paper);border-radius:34px;padding:18px 18px 22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;box-shadow:0 8px 0 var(--line);transition:transform .12s}
.pick .pk-girl{width:170px;height:200px;border-radius:50%/44%;background:var(--sky);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pick .pk-girl svg{width:160px}
.pick[data-pick="yumin"] .pk-girl{background:#FFE6EE}
.pick b{font-family:var(--f-display);font-weight:400;font-size:38px}
.pick .pk-shop{font-size:18px;color:var(--ink-soft)}
.pick .pk-perk{margin-top:6px;font-size:17px;background:#FFF6DA;border-radius:16px;padding:8px 12px;line-height:1.4;text-align:center}
.pick .pk-perk strong{font-family:var(--f-display);font-weight:400;color:var(--berry);display:block;font-size:20px}
.pick.on{border-color:var(--pink-deep);transform:translateY(-6px);box-shadow:0 12px 0 var(--pink)}
.pick .pk-tag{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:20px;color:#fff;background:var(--pink-deep);border-radius:999px;padding:4px 16px;white-space:nowrap}
.pick .pk-tag.cpu{background:var(--ink-soft)}
.diff-row{display:flex;align-items:center;gap:14px}
.lbl{font-family:var(--f-display);font-size:24px;color:var(--ink-soft)}
.chips{display:flex;gap:10px}
.chip{font-family:var(--f-display);font-size:24px;border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 22px;cursor:pointer}
.chip.on{background:var(--butter);border-color:var(--gold)}
.nav-row{display:flex;gap:20px}

/* ---------- mode ---------- */
.matchup{margin:0;font-family:var(--f-display);font-size:24px;color:var(--ink-soft)}
.mode-row{display:flex;gap:24px}
.mode{width:320px;border:5px solid var(--line);background:var(--paper);border-radius:34px;padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 var(--line);text-align:center}
.mode:active{transform:translateY(5px);box-shadow:0 3px 0 var(--line)}
.mode .mode-art{height:170px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.mode .mode-art svg{height:100%}
.mode b{font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--berry)}
.mode span{font-size:18px;color:var(--ink-soft);line-height:1.4}
.port .mode-row{flex-direction:column}
.port .mode{width:620px;flex-direction:row;text-align:left;gap:20px;padding:14px 24px}
.port .mode .mode-art{height:140px;width:180px;flex:none}
.port .mode .mode-txt{display:flex;flex-direction:column;gap:6px}

/* ---------- game layout ---------- */
.screen.game-scr{display:grid;align-items:stretch;justify-content:stretch;gap:14px;padding:14px 18px 18px;
  grid-template-areas:"hud hud" "main cpu";grid-template-columns:minmax(0,1fr) 260px;grid-template-rows:86px minmax(0,1fr)}
.port .screen.game-scr{grid-template-areas:"hud" "cpu" "main";grid-template-columns:minmax(0,1fr);grid-template-rows:86px 150px minmax(0,1fr)}
.hud{grid-area:hud;display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:28px;padding:0 16px;box-shadow:0 5px 0 var(--line)}
.hud-side{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.hud-side.them{flex-direction:row-reverse;text-align:right}
.hud-av{width:64px;height:64px;border-radius:50%;background:#FFE6EE;overflow:hidden;flex:none}
.them .hud-av{background:var(--sky)}
.hud-av svg{width:100%;height:100%;display:block}
.hud-info{display:flex;flex-direction:column;min-width:0}
.hud-info b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink-soft);white-space:nowrap}
.hud-score{font-family:var(--f-display);font-size:38px;line-height:1;color:var(--berry);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.them .hud-score{flex-direction:row-reverse}
.hud-score svg{width:30px;height:28px}
.hud-score.bump span{animation:pop .3s}
.hud-pill{font-family:var(--f-display);font-size:20px;color:#fff;background:var(--gold);border-radius:999px;padding:4px 14px;white-space:nowrap}
.hud-pill.soft{background:var(--mint);color:var(--ink)}
.hud-timer{width:124px;height:66px;border-radius:33px;background:var(--butter);display:flex;align-items:baseline;justify-content:center;gap:2px;font-family:var(--f-display);font-size:46px;line-height:66px;font-variant-numeric:tabular-nums;flex:none}
.hud-timer small{font-size:22px}
.hud-timer.hurry{background:var(--pink-deep);color:#fff;animation:pulse .5s ease-in-out infinite alternate}
.game-main{grid-area:main;position:relative;min-width:0;min-height:0}
.game{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px}

/* cpu panel */
.cpu-panel{grid-area:cpu;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 14px;box-sizing:border-box;min-width:0;overflow:hidden}
.port .cpu-panel{flex-direction:row;padding:10px 18px;gap:16px}
.cp-girl{width:150px;flex:none}
.port .cp-girl{width:100px}
.cp-girl svg{width:100%;display:block}
.cp-text{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.port .cp-text{flex:1;align-items:flex-start;text-align:left}
.cp-sign{font-family:var(--f-display);font-size:22px;color:#fff;background:#7FB6E8;border-radius:14px;padding:4px 14px}
.cp-say{font-size:19px;background:#F2F8FF;border-radius:16px;padding:8px 12px;line-height:1.35;min-height:26px}
.cp-say.pop{animation:pop .35s}
.cp-tag{font-size:15px;color:var(--ink-soft)}
.cp-stage{flex:1;width:100%;position:relative;min-height:120px;display:flex;align-items:center;justify-content:center}
.port .cp-stage{flex:none;width:230px;min-height:0;height:100%}
.cp-birds{position:absolute;inset:0}
.cp-bird{position:absolute;left:50%;bottom:6px;width:96px;margin-left:-48px;animation:cpvisit 1.4s ease-in-out forwards}
.cp-bird.sad{animation-name:cpvisitSad}
.cp-bird svg{width:100%;display:block}
.cp-mini{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.cp-plate{width:88%;height:26px;border-radius:13px;background:#E3E8EC;overflow:hidden;box-shadow:inset 0 0 0 3px #CBD3DA}
.cp-plate i{display:block;height:100%;width:0;background:linear-gradient(90deg,#BFE0FF,#7FB6E8)}
.cp-cups{font-family:var(--f-display);font-size:22px;color:var(--ink-soft)}
.cp-cupicon svg{width:70px}

/* ---------- order game ---------- */
.customers{height:292px;flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;border-radius:28px;position:relative;overflow:hidden;
  padding:34px 12px 10px;box-sizing:border-box;background:linear-gradient(#D7ECFF,#F3F9FF)}
.port .customers{height:400px}
.port .bubble .ice{width:84px;height:138px}
.port .cust .bird{width:132px}
.port .pat{width:120px}
.customers::before{content:"";position:absolute;left:0;right:0;top:0;height:30px;
  background:radial-gradient(circle at 20px 30px,transparent 14px,transparent 0) ,repeating-linear-gradient(90deg,var(--pink) 0 40px,#fff 40px 80px);
  -webkit-mask:radial-gradient(circle at 20px 18px,#000 20px,transparent 21px) 0 0/40px 30px,linear-gradient(#000,#000) 0 0/100% 18px no-repeat;
  mask:radial-gradient(circle at 20px 18px,#000 20px,transparent 21px) 0 0/40px 30px,linear-gradient(#000,#000) 0 0/100% 18px no-repeat}
.slot{position:relative;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;min-width:0}
.cust{display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;animation:flyin .6s cubic-bezier(.2,.9,.3,1.2)}
.cust.leave-happy{animation:leaveHappy .7s ease-in forwards}
.cust.leave-sad{animation:leaveSad .7s ease-in forwards}
.cust.nudge .bubble{animation:nudge .35s}
.bubble{background:var(--paper);border-radius:22px;padding:4px 14px;position:relative;box-shadow:0 4px 0 rgba(74,56,51,.08)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-10px;border:10px solid transparent;border-top-color:var(--paper);border-bottom:0}
.bubble .ice{width:68px;height:112px;display:block}
.special .bubble{box-shadow:0 0 0 4px var(--gold),0 4px 0 rgba(74,56,51,.08)}
.x2{position:absolute;top:-10px;right:-14px;font-family:var(--f-display);font-size:20px;color:#fff;background:var(--gold);border-radius:999px;padding:2px 9px;box-shadow:0 3px 0 #D89A23}
.cust .bird{width:112px;margin-top:8px}
.cust .bird svg{width:100%;display:block}
.special .bird svg{filter:drop-shadow(0 0 8px rgba(245,184,61,.9))}
.pat{width:104px;height:12px;border-radius:6px;background:rgba(255,255,255,.9);overflow:hidden;box-shadow:inset 0 0 0 2px #E4EEF7}
.pat i{display:block;height:100%;width:100%;background:var(--mint);border-radius:6px}
.pat i.warn{background:var(--butter)}
.pat i.danger{background:var(--pink-deep)}
.say{position:absolute;left:50%;top:44%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-display);font-size:20px;background:var(--ink);color:#fff;border-radius:14px;padding:4px 12px;opacity:0;pointer-events:none;z-index:3}
.say.show{animation:sayShow 1.2s ease forwards}

.bench{flex:1;display:flex;gap:14px;min-height:0}
.build{width:230px;flex:none;background:var(--paper);border-radius:28px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;box-sizing:border-box;position:relative}
.port .build{width:210px}
.build-cap{font-family:var(--f-display);font-size:18px;color:var(--ink-soft)}
.build-ice{height:190px;display:flex;align-items:flex-end}
.build-ice svg{height:100%}
.build-txt{font-size:16px;text-align:center;line-height:1.35;min-height:44px;color:var(--ink)}
.build-txt.warn{color:var(--berry);font-family:var(--f-display);font-size:19px}
.tray{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;background:#FFF9F3;border-radius:28px;padding:10px 14px;box-sizing:border-box;min-width:0;box-shadow:inset 0 0 0 3px #F6E6DA}
.tray-row{display:flex;align-items:center;gap:10px;border-radius:20px;padding:2px 4px}
.tray-row.flash{animation:flash .5s 2}
.tray-lbl{width:48px;flex:none;font-family:var(--f-display);font-size:20px;color:var(--ink-soft)}
.tile{width:92px;height:92px;flex:none;border-radius:24px;background:var(--paper);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;font-family:var(--f-display);font-size:17px}
.port .tile{width:88px;height:88px}
.tile svg{height:56px;width:56px}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.tile.sel{border-color:var(--pink-deep);background:#FFF0F5}
.tile.trash{background:#FFF6DA;border-color:#F4DFA0;box-shadow:0 5px 0 #F4DFA0}

/* ---------- roll game ---------- */
.roll-top{height:150px;flex:none;display:flex;align-items:center;gap:16px;border-radius:28px;padding:0 20px;box-sizing:border-box;background:linear-gradient(#D7ECFF,#F3F9FF)}
.port .roll-top{height:170px}
.r-cust{display:flex;align-items:center;gap:6px;position:relative}
.r-cust.arrive{animation:flyin .6s cubic-bezier(.2,.9,.3,1.2)}
.r-cust.leave{animation:leaveHappy .6s ease-in forwards}
.r-cust .bird{width:118px}
.r-cust .bird svg{width:100%;display:block}
.r-cust.special .bird svg{filter:drop-shadow(0 0 8px rgba(245,184,61,.9))}
.r-cust.nudge .r-bubble{animation:nudge .35s}
.r-bubble{position:relative;background:var(--paper);border-radius:22px;padding:8px 16px 8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(74,56,51,.08)}
.r-bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.r-bubble.gold{box-shadow:0 0 0 4px var(--gold);padding-right:30px}
.r-bubble svg{width:54px;height:64px}
.r-bubble .cupsvg{width:80px;height:86px}
.r-bubble b{font-family:var(--f-display);font-weight:400;font-size:28px;display:block;line-height:1.1}
.r-bubble small{font-size:17px;color:var(--ink-soft)}
.r-bubble .got{font-family:var(--f-display);font-size:34px;color:var(--berry)}
.steps{list-style:none;display:flex;gap:8px;margin:0 0 0 auto;padding:0;flex-wrap:wrap;justify-content:flex-end}
.steps li{font-family:var(--f-display);font-size:20px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink-soft)}
.steps li.on{background:var(--pink-deep);color:#fff;animation:pop .3s}
.steps li.done{background:var(--mint);color:var(--ink)}
.plate-zone{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.plate{position:relative;width:600px;height:290px;border-radius:28px;touch-action:none;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,#F5F8FA 0%,#D5DCE2 55%,#E9EEF2 100%);
  box-shadow:inset 0 0 0 10px #B9C3CC,inset 0 0 0 13px #EEF2F5,0 10px 0 #98A5B0,0 18px 30px rgba(0,0,0,.12)}
.port .plate{width:660px;height:330px}
.plate.thump{animation:thump .12s}
.plate::after{content:"";position:absolute;inset:13px;border-radius:18px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 40px,rgba(255,255,255,.35) 40px 44px);pointer-events:none}
.plate-hint{position:absolute;left:11.5%;top:50%;width:17%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:26px;line-height:1.25;text-align:center;color:rgba(74,56,51,.38);pointer-events:none;z-index:1}
.sheet{position:absolute;overflow:hidden;z-index:2;box-shadow:inset 0 -6px 0 rgba(0,0,0,.05)}
.sheet.pouring{animation:pourIn .5s cubic-bezier(.3,1.4,.5,1)}
.sheet.frozen{box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset 0 -6px 0 rgba(0,0,0,.06)}
.f-straw{background:#F9B3C6}
.f-oreo{background:#F1ECE6}
.f-milk{background:#FFF8E6}
.sheet.frozen.f-straw{background:#FAC4D2}
.sheet.frozen.f-oreo{background:#F6F2EE}
.sheet.frozen.f-milk{background:#FFFCF3}
.bit{position:absolute;width:12px;height:10px;border-radius:3px;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.b-straw{background:#E0405F}
.b-oreo{background:#2F2522;border-radius:50%;width:10px;height:10px}
.b-milk{background:#EADCB9;border-radius:50%;width:9px;height:9px}
.r-rolls{position:absolute;left:3.5%;top:11%;width:16%;height:78%;display:flex;flex-direction:column;justify-content:space-around;align-items:center;z-index:3}
.roll{width:94%;height:19%;border-radius:999px;position:relative;animation:pop .3s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08),0 3px 0 rgba(0,0,0,.08)}
.roll::before{content:"";position:absolute;left:4px;top:50%;width:calc(100% / 3.4);aspect-ratio:1;max-height:86%;transform:translateY(-50%);border-radius:50%;
  background:repeating-radial-gradient(circle,rgba(255,255,255,.85) 0 2px,rgba(0,0,0,.12) 2px 4px)}
.roll.good{transform:rotate(-5deg)}
.roll.miss{height:13%;border-radius:40% 60% 45% 55%;transform:rotate(4deg);filter:saturate(.7)}
.spat{position:absolute;width:70px;height:46px;z-index:5;pointer-events:none;animation:spat .25s ease-out forwards}
.spat svg{width:100%;height:100%}
.roll-ctrl{height:150px;flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:12px 16px}

<script>
(() => {
'use strict';

/* =========================================================

      serve:['소민이 잘했지?','짜잔~!','오목눈이 맛있대!','헤헤 또 와~'],

};
const FKEYS = ['straw','oreo','milk','choco'];
const ROLLF = { straw:'딸기', oreo:'오레오', milk:'흰우유' };
const TOPS = { cherry:'체리', sprinkle:'스프링클', heart:'하트쿠키' };
const TKEYS = Object.keys(TOPS);

/* =========================================================

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rnd = (a, b) => a + Math.random() * (b - a);

const STAGE = $('#stage'), FX = $('#fx'), OV = $('#overlay');

function fit(){
  const v = $('#view'); const w = v.clientWidth, h = v.clientHeight;

addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 200));

/* ---------- 소리 ---------- */
let actx = null, muted = false;
try { muted = localStorage.getItem('omok-muted') === '1'; } catch(e) {}
function tone(f, dur=.12, type='sine', vol=.14, when=0, slide=0){
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + when;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .03);
  } catch(e) {}
}

  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.14,i*.1)) },

  miss(){ tone(300,.2,'triangle',.1,0,-120) },

function toggleSound(){ muted = !muted; try { localStorage.setItem('omok-muted', muted ? '1' : '0'); } catch(e) {} renderSoundBtn(); $$('.snd-label').forEach(e => e.textContent = muted ? '소리 켜기' : '소리 끄기'); if (!muted) sfx.tap(); }

/* =========================================================

const HEART = '<svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 21C5 15.5 1 12 1 7a5.5 5.5 0 0 1 11-2.5A5.5 5.5 0 0 1 23 7c0 5-4 8.5-11 14z" fill="#F0628F"/><ellipse cx="7" cy="7" rx="2.4" ry="1.6" fill="#fff" opacity=".6"/></svg>';
const CROWN = '<svg class="crown" viewBox="0 0 60 40" aria-hidden="true"><path d="M4 36L8 10l12 14L30 4l10 20 12-14 4 26z" fill="#F5B83D" stroke="#C98A1A" stroke-width="2" stroke-linejoin="round"/><circle cx="30" cy="24" r="4" fill="#F0628F"/><circle cx="16" cy="29" r="2.6" fill="#8EC5F5"/><circle cx="44" cy="29" r="2.6" fill="#8EC5F5"/></svg>';

function birdSVG(o = {}){

function scoopG(f, cx, cy, r = 25){
  const F = FLAVORS[f];
  let bits = '';
  if (F.bits){
    const pts = [[-11,-7],[8,-13],[13,3],[-3,7],[-15,6],[3,-3],[10,12]];
    bits = pts.map(([x,y]) => f === 'straw'
      ? `<rect x="${cx+x-2.5}" y="${cy+y-2}" width="5" height="4" rx="1.4" fill="${F.bits}"/>`
      : `<circle cx="${cx+x}" cy="${cy+y}" r="2.3" fill="${F.bits}"/>`).join('');
  }
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${F.base}" stroke="${F.dark}" stroke-width="2"/>
    <path d="M${cx-r+2} ${cy+8}q6 7 12 2q6 8 12 1q6 8 12 1q6 7 12-2" fill="none" stroke="${F.dark}" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    ${bits}<ellipse cx="${cx-9}" cy="${cy-11}" rx="6.5" ry="4" fill="#fff" opacity=".55"/>`;
}

function stagePos(el){
  const r = el.getBoundingClientRect(), s = STAGE.getBoundingClientRect();
  return { x:(r.left + r.width / 2 - s.left) / scale, y:(r.top + r.height / 2 - s.top) / scale };
}
function floatAt(el, html, cls = '', dy = 0){
  if (!el) return;
  const p = stagePos(el);
  const f = document.createElement('div');
  f.className = 'float ' + cls; f.innerHTML = html;
  f.style.left = p.x + 'px'; f.style.top = (p.y + dy) + 'px';
  FX.appendChild(f); setTimeout(() => f.remove(), 1150);
}
function confetti(){
  const cols = ['#F7A8C0','#FFE08A','#9FDCC6','#BFE0FF','#E2719A','#F5B83D','#B79CF2'];
  for (let i = 0; i < 80; i++){
    const c = document.createElement('i'); c.className = 'conf';
    c.style.left = rnd(0, 100) + '%'; c.style.background = pick(cols);
    c.style.animationDelay = rnd(0, .9) + 's'; c.style.animationDuration = rnd(2.2, 3.8) + 's';
    FX.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}

}

function buildTray(){
  $('#tray').innerHTML =
    `<div class="tray-row" data-row="container"><span class="tray-lbl">그릇</span>${Object.keys(CONT).map(k => `<button class="tile" data-act="container" data-val="${k}">${iconContainer(k)}<span>${CONT[k]}</span></button>`).join('')}</div>` +
    `<div class="tray-row" data-row="flavor"><span class="tray-lbl">맛</span>${FKEYS.map(f => `<button class="tile" data-act="scoop" data-val="${f}">${iconScoop(f)}<span>${FLAVORS[f].name}</span></button>`).join('')}</div>` +
    `<div class="tray-row" data-row="topping"><span class="tray-lbl">토핑</span>${TKEYS.map(t => `<button class="tile" data-act="topping" data-val="${t}">${iconTop(t)}<span>${TOPS[t]}</span></button>`).join('')}<button class="tile trash" data-act="clear">${ICON_RESET}<span>다시</span></button></div>`;
}

function makeOrder(el){
  const lvl = el < 20 ? 1 : el < 50 ? 2 : 3;
  const n = lvl === 1 ? 1 : lvl === 2 ? pick([1,2,2]) : pick([2,2,3,3]);
  const scoops = Array.from({ length:n }, () => pick(FKEYS));
  const topping = lvl === 1 ? null : (Math.random() < (lvl === 2 ? .45 : .7) ? pick(TKEYS) : null);
  return { container: pick(['cup','cone']), scoops, topping };
}
function sameIce(a, b){
  if (a.container !== b.container || (a.topping || null) !== (b.topping || null) || a.scoops.length !== b.scoops.length) return false;
  if (STRICT_ORDER) return a.scoops.every((f, i) => f === b.scoops[i]);
  return [...a.scoops].sort().join() === [...b.scoops].sort().join();
}

function OrderGame(){
  const d = DIFF[S.diff];
  $('#game-roll').hidden = true; $('#game-order').hidden = false;
  const slotEls = $$('#customers .slot');
  slotEls.forEach(s => s.innerHTML = '');
  cpuPanel('order');
  const g = {
    kind:'order', running:false, over:false, time:ORDER_TIME, el:0, shown:-1,
    score:0, cscore:0, combo:0, served:0,
    slots:[null,null,null], spawn:[.4, 1.6, 3.2],
    b:{ container:null, scoops:[], topping:null },
    cpuT: rnd(...d.order) + 1,
  };
  let hintT = 0;
  renderBuild();

  function renderBuild(msg){
    const b = g.b;
    $('#build-ice').innerHTML = b.container ? iceSVG(b, '') : emptyIceSVG();
    const t = $('#build-txt');
    clearTimeout(hintT);
    if (msg){ t.className = 'build-txt warn'; t.textContent = msg; hintT = setTimeout(() => renderBuild(), 1400); return; }
    t.className = 'build-txt';
    if (!b.container) t.textContent = '그릇부터 골라요';
    else t.textContent = [CONT[b.container], b.scoops.map(f => FLAVORS[f].name).join(' + '), b.topping ? TOPS[b.topping] : ''].filter(Boolean).join(' · ');
    $$('#tray [data-act="container"]').forEach(x => x.classList.toggle('sel', x.dataset.val === b.container));
    $$('#tray [data-act="topping"]').forEach(x => x.classList.toggle('sel', x.dataset.val === b.topping));
  }
  function custHTML(c){
    return `<div class="cust ${c.special ? 'special' : ''}">
      <div class="bubble">${iceSVG(c.o)}${c.special ? '<span class="x2">×2</span>' : ''}</div>
      <div class="bird">${birdSVG({ acc:c.acc, ribbon:c.ribbon })}</div>
      <div class="pat"><i></i></div>
      <div class="say"></div>
    </div>`;
  }
  function spawn(i){
    const o = makeOrder(g.el);
    const special = Math.random() < (S.player === 'somin' ? .28 : .15);
    const max = 15 + o.scoops.length * 5 + (o.topping ? 3 : 0);
    const c = { o, special, max, left:max, ribbon: special ? pick(RIBBONS) : null, acc: special ? null : pick([null, null, 'flower', 'leaf', 'mandarin']) };
    slotEls[i].innerHTML = custHTML(c);
    c.el = slotEls[i].firstElementChild; c.bar = $('.pat i', c.el);
    g.slots[i] = c; sfx.pop();
  }
  function sayBird(c, t){ const s = $('.say', c.el); s.textContent = t; replay(s, 'show'); }
  function leave(i, happy){
    const c = g.slots[i]; if (!c) return;
    g.slots[i] = null;
    $('.bird', c.el).innerHTML = birdSVG({ acc:c.acc, ribbon:c.ribbon, mood: happy ? 'happy' : 'sad' });
    const el = c.el;
    setTimeout(() => el.classList.add(happy ? 'leave-happy' : 'leave-sad'), happy ? 250 : 500);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 1300);
    g.spawn[i] = rnd(1.4, 2.6);
  }
  function serve(i){
    const c = g.slots[i]; if (!c) return;
    const b = g.b;
    if (!b.container || !b.scoops.length){ renderBuild('아이스크림을 먼저 만들어요!'); replay(c.el, 'nudge'); sfx.bad(); return; }
    if (sameIce(b, c.o)){
      g.combo++;
      const base = 2 + c.o.scoops.length + (c.o.topping ? 1 : 0);
      const r = c.left / c.max;
      const speed = r > .5 ? 2 : r > .25 ? 1 : 0;
      const comboB = g.combo >= 3 ? Math.min(3, Math.floor(g.combo / 3)) + (S.player === 'yumin' ? 1 : 0) : 0;
      const pts = (base + speed + comboB) * (c.special ? 2 : 1);
      g.score += pts; g.served++;
      floatAt($('.bird', c.el), `${HEART}+${pts}`, c.special ? 'big' : '', -30);
      if (c.special) setTimeout(() => floatAt($('#customers'), '리본 손님 2배!', 'good'), 150);
      else if (speed === 2) sayBird(c, '빨리 줘서 고마워!');
      (c.special || comboB) ? sfx.great() : sfx.good();
      leave(i, true);
      g.b = { container:null, scoops:[], topping:null };
      renderBuild();
      hudScore(g.score, g.cscore);
    } else {
      g.combo = 0;
      c.left = Math.max(1, c.left - 3);
      sayBird(c, '이게 아니에요~');
      replay(c.el, 'nudge'); sfx.bad();
    }
    hudPill('p', g.combo >= 2 ? `콤보 ${g.combo}` : '');
  }
  function tray(act, val){
    const b = g.b;
    if (act === 'container'){ b.container = val; sfx.tap(); }
    else if (act === 'scoop'){
      if (!b.container){ replay($('#tray [data-row="container"]'), 'flash'); renderBuild('그릇(컵/콘)부터 골라요!'); sfx.bad(); return; }
      if (b.scoops.length >= 3){ renderBuild('3개까지만 쌓을 수 있어요'); sfx.bad(); return; }
      b.scoops.push(val); sfx.pop();
    }
    else if (act === 'topping'){
      if (!b.scoops.length){ replay($('#tray [data-row="flavor"]'), 'flash'); renderBuild('아이스크림을 먼저 올려요!'); sfx.bad(); return; }
      b.topping = b.topping === val ? null : val; sfx.tap();
    }
    else if (act === 'clear'){ g.b = { container:null, scoops:[], topping:null }; sfx.tap(); }
    renderBuild();
  }
  function cpuServe(){
    const ok = Math.random() > d.miss;
    const box = $('#cp-birds'); if (!box) return;
    const b = document.createElement('div');
    b.className = 'cp-bird' + (ok ? '' : ' sad');
    b.innerHTML = birdSVG({ mood: ok ? 'normal' : 'sad', acc: pick([null,'flower','leaf']) });
    box.appendChild(b);
    setTimeout(() => { if (ok) b.innerHTML = birdSVG({ mood:'happy' }); }, 600);
    setTimeout(() => b.remove(), 1450);
    if (ok){
      let pts = rint(...d.orderPts); if (Math.random() < .15) pts *= 2;
      g.cscore += pts;
      setTimeout(() => { floatAt(box, `${HEART}+${pts}`, 'cpu'); hudScore(g.score, g.cscore); }, 500);
      cpuMood('cheer');
      if (Math.random() < .35) cpuSay(pick(CH[S.cpu].lines.serve));
    } else { cpuMood('sad'); cpuSay(pick(CH[S.cpu].lines.oops)); }
  }
  function update(dt){
    if (g.over) return;
    g.time -= dt; g.el += dt;
    for (let i = 0; i < 3; i++){
      const c = g.slots[i];
      if (!c){ g.spawn[i] -= dt; if (g.spawn[i] <= 0 && g.time > 4) spawn(i); continue; }
      c.left -= dt;
      const r = Math.max(0, c.left / c.max);
      c.bar.style.width = (r * 100) + '%';
      c.bar.className = r < .25 ? 'danger' : r < .5 ? 'warn' : '';
      if (c.left <= 0){ g.combo = 0; hudPill('p', ''); sayBird(c, '흥! 너무 늦었어'); sfx.miss(); leave(i, false); }
    }
    g.cpuT -= dt;
    if (g.cpuT <= 0){ cpuServe(); g.cpuT = rnd(...d.order) * rubber(g.score, g.cscore); }
    timerTick(g);
    if (g.time <= 0){ g.over = true; finishRound('order', g); }
  }
  return Object.assign(g, { update, serve, tray });
}

/* =========================================================
   게임 2: 철판 롤 대결
   ========================================================= */
function RollGame(){
  const d = DIFF[S.diff];
  $('#game-order').hidden = true; $('#game-roll').hidden = false;
  const plate = $('#plate'), sheet = $('#sheet'), rollsEl = $('#r-rolls'), ctrl = $('#roll-ctrl'), custEl = $('#r-cust'), hint = $('#plate-hint');
  const steps = $$('#steps li');
  cpuPanel('roll');
  const g = {
    kind:'roll', running:false, over:false, time:ROLL_TIME, el:0, shown:-1,
    score:0, cscore:0, cups:0, ccups:0,
    phase:null, cust:null, chops:0, spread:0, rolls:[], cupStart:0,
    needle:0, dir:1, speed:.9, isDown:false, lx:0, ly:0, scrapeAcc:0,
    cprog:0, cdur: rnd(...d.roll),
  };
  let needleEl = null;

  function newCust(){
    const f = pick(['straw','oreo','milk']);
    const special = Math.random() < (S.player === 'somin' ? .28 : .15);
    g.cust = { f, special, ribbon: special ? pick(RIBBONS) : null, acc: special ? null : pick([null,'flower','leaf','mandarin']) };
    custEl.className = 'r-cust' + (special ? ' special' : '');
    custEl.innerHTML = `<div class="bird">${birdSVG({ acc:g.cust.acc, ribbon:g.cust.ribbon })}</div>
      <div class="r-bubble ${special ? 'gold' : ''}">${jugSVG(f)}<div><b>${ROLLF[f]} 롤</b><small>${ROLLS}개 주세요!</small></div>${special ? '<span class="x2">×2</span>' : ''}</div>
      <div class="say"></div>`;
    replay(custEl, 'arrive');
    resetPlate();
    g.cupStart = g.el;
    g.speed = Math.min(1.75, .85 + g.cups * .12);
    setPhase('pour');
  }
  function resetPlate(){
    sheet.hidden = true; sheet.className = 'sheet'; sheet.innerHTML = ''; sheet.removeAttribute('style');
    rollsEl.innerHTML = ''; g.chops = 0; g.spread = 0; g.rolls = [];
  }
  function sayCust(t){ const s = $('.say', custEl); if (!s) return; s.textContent = t; replay(s, 'show'); }
  function setPhase(p){
    g.phase = p;
    const idx = { pour:0, chop:1, spread:2, roll:3, serve:4 }[p];
    steps.forEach((li, i) => { li.classList.toggle('on', i === idx); li.classList.toggle('done', i < idx); });
    hint.textContent = p === 'chop' ? '톡톡!' : p === 'spread' ? '슥슥 문질러요' : '';
    needleEl = null;
    if (p === 'pour') ctrl.innerHTML = `<div class="ctrl-msg">손님이 원하는 맛을 철판에 부어요</div>` +
      ['straw','oreo','milk'].map(f => `<button class="tile jug" data-act="pour" data-val="${f}">${jugSVG(f)}<span>${ROLLF[f]}</span></button>`).join('');
    else if (p === 'chop') ctrl.innerHTML = `<div class="ctrl-msg">철판을 톡톡 두드려서 다져요! <b id="chop-n">0</b> / ${CHOPS}</div><div class="dots" id="chop-dots">${'<i></i>'.repeat(CHOPS)}</div>`;
    else if (p === 'spread') ctrl.innerHTML = `<div class="ctrl-msg">철판을 손가락으로 문질러서 넓게 펴요!</div><div class="progress"><i id="spread-bar"></i></div>`;
    else if (p === 'roll'){
      ctrl.innerHTML = `<div class="ctrl-msg">바늘이 <b>초록색</b>에 올 때 돌돌! <b id="roll-n">0</b> / ${ROLLS}</div>
        <div class="meter"><span class="zone-good"></span><span class="zone-perfect"></span><span class="needle" id="needle"></span></div>
        <button class="btn roll-btn" data-act="roll">돌돌!</button>`;
      needleEl = $('#needle'); g.needle = Math.random() * .25; g.dir = 1;
    }
    else if (p === 'serve') ctrl.innerHTML = `<div class="ctrl-msg">완성! 손님에게 드렸어요</div>`;
  }
  function sheetGeo(){
    const pw = plate.offsetWidth, ph = plate.offsetHeight;
    return { pw, ph, cw: .24 * pw, cx: .58 * pw, cy: .5 * ph, R: { l:.22 * pw, t:.12 * ph, w:.72 * pw, h:.76 * ph } };
  }
  function setSheet(t){
    const { cw, cx, cy, R } = sheetGeo();
    const e = Math.max(0, Math.min(1, t)), k = 1 - Math.pow(1 - e, 2);
    const w = cw + (R.w - cw) * k, h = cw + (R.h - cw) * k;
    const l = (cx - cw / 2) + (R.l - (cx - cw / 2)) * k, tp = (cy - cw / 2) + (R.t - (cy - cw / 2)) * k;
    Object.assign(sheet.style, { left:l + 'px', top:tp + 'px', width:w + 'px', height:h + 'px', borderRadius:`calc(${50 * (1 - k)}% + ${16 * k}px)` });
  }
  function setSheetRolled(n){
    const { R } = sheetGeo();
    if (n >= ROLLS){ sheet.hidden = true; return; }
    const cut = R.w * (n / ROLLS);
    Object.assign(sheet.style, { left:(R.l + cut) + 'px', width:(R.w - cut) + 'px' });
    // 남은 판 위의 조각 위치 보정
    $$('.bit', sheet).forEach(bt => { const x = +bt.dataset.x; bt.style.display = x < (n / ROLLS) * 100 ? 'none' : ''; bt.style.left = ((x - (n / ROLLS) * 100) / (1 - n / ROLLS)) + '%'; });
  }
  function addBits(n){
    const f = g.cust.f;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 38;
      const x = 50 + Math.cos(a) * r, y = 50 + Math.sin(a) * r;
      const b = document.createElement('i');
      b.className = 'bit b-' + f; b.dataset.x = x;
      b.style.left = x + '%'; b.style.top = y + '%'; b.style.setProperty('--r', rint(0, 90) + 'deg');
      sheet.appendChild(b);
    }
  }
  function pour(f){
    if (g.phase !== 'pour') return;
    if (f !== g.cust.f){ sfx.bad(); sayCust('그 맛이 아니에요~'); replay(custEl, 'nudge'); return; }
    sfx.pour(); g.phase = 'busy';
    sheet.hidden = false; sheet.className = 'sheet f-' + f; setSheet(0); replay(sheet, 'pouring');
    setTimeout(() => { if (!g.over) setPhase('chop'); }, 520);
  }
  function chop(x, y){
    g.chops++; sfx.chop(); addBits(3); replay(plate, 'thump');
    const s = document.createElement('div'); s.className = 'spat'; s.innerHTML = SPATULA;
    s.style.left = x + 'px'; s.style.top = y + 'px'; plate.appendChild(s); setTimeout(() => s.remove(), 260);
    const n = $('#chop-n'); if (n) n.textContent = g.chops;
    $$('#chop-dots i').forEach((dot, i) => dot.classList.toggle('on', i < g.chops));
    if (g.chops >= CHOPS){ g.phase = 'busy'; sheet.classList.add('frozen'); sfx.good(); setTimeout(() => { if (!g.over) setPhase('spread'); }, 380); }
  }
  function spreadBy(dist){
    g.spread += dist; g.scrapeAcc += dist;
    if (g.scrapeAcc > 120){ g.scrapeAcc = 0; sfx.scrape(); }
    const t = Math.min(1, g.spread / SPREAD_NEED);
    setSheet(t);
    const bar = $('#spread-bar'); if (bar) bar.style.width = (t * 100) + '%';
    if (t >= 1){ g.phase = 'busy'; sfx.good(); setTimeout(() => { if (!g.over) setPhase('roll'); }, 300); }
  }
  function doRoll(){
    if (g.phase !== 'roll') return;
    const off = Math.abs(g.needle - .5);
    const q = off < .07 ? 'perfect' : off < .2 ? 'good' : 'miss';
    g.rolls.push(q);
    floatAt(plate, q === 'perfect' ? '완벽해!' : q === 'good' ? '좋아!' : '앗, 찌그러졌다', q, -40);
    sfx[q === 'perfect' ? 'perfect' : q === 'good' ? 'okay' : 'miss']();
    const r = document.createElement('div'); r.className = `roll f-${g.cust.f} ${q}`; rollsEl.appendChild(r);
    const n = g.rolls.length; setSheetRolled(n);
    const rn = $('#roll-n'); if (rn) rn.textContent = n;
    g.needle = Math.random() * .2; g.dir = 1;
    if (n >= ROLLS){ g.phase = 'busy'; setTimeout(serveCup, 450); }
  }
  function serveCup(){
    if (g.over) return;
    const t = g.el - g.cupStart;
    const per = g.rolls.reduce((s, q) => s + (q === 'perfect' ? 2 : q === 'good' ? 1 : 0), 0);
    const speed = t < 14 ? 2 : t < 20 ? 1 : 0;
    const allPerfect = g.rolls.every(q => q === 'perfect');
    const pts = (3 + per + speed + (allPerfect ? 2 : 0)) * (g.cust.special ? 2 : 1);
    g.score += pts; g.cups++;
    hudScore(g.score, g.cscore); hudPill('p', `${g.cups}컵`);
    setPhase('serve'); resetPlate();
    $('.bird', custEl).innerHTML = birdSVG({ acc:g.cust.acc, ribbon:g.cust.ribbon, mood:'happy' });
    $('.r-bubble', custEl).innerHTML = `${rollCupSVG(g.cust.f)}<span class="got">+${pts}</span>`;
    floatAt($('.bird', custEl), `${HEART}+${pts}`, g.cust.special || allPerfect ? 'big' : '', -30);
    if (allPerfect) setTimeout(() => floatAt(plate, '올 퍼펙트! +2', 'perfect'), 200);
    (allPerfect || g.cust.special) ? sfx.great() : sfx.good();
    setTimeout(() => { if (!g.over) custEl.classList.add('leave'); }, 950);
    setTimeout(() => { if (!g.over) newCust(); }, 1500);
  }
  function down(x, y, cx, cy){
    g.isDown = true; g.lx = cx; g.ly = cy;
    if (g.phase === 'chop') chop(x, y);
    else if (g.phase === 'roll') doRoll();
    else if (g.phase === 'pour'){ replay(ctrl, 'nudge'); }
  }
  function move(cx, cy){
    if (!g.isDown) return;
    const dist = Math.hypot(cx - g.lx, cy - g.ly) / scale;
    g.lx = cx; g.ly = cy;
    if (g.phase === 'spread') spreadBy(dist);
  }
  function up(){ g.isDown = false; }
  function ctrlAct(act, val){ if (act === 'pour') pour(val); else if (act === 'roll') doRoll(); }
  function update(dt){
    if (g.over) return;
    g.time -= dt; g.el += dt;
    if (g.phase === 'roll' && needleEl){
      g.needle += g.dir * g.speed * dt;
      if (g.needle > 1){ g.needle = 1; g.dir = -1; }
      if (g.needle < 0){ g.needle = 0; g.dir = 1; }
      needleEl.style.left = (g.needle * 100) + '%';
    }
    g.cprog += dt / g.cdur;
    const fill = $('#cp-fill'); if (fill) fill.style.width = Math.min(100, g.cprog * 100) + '%';
    if (g.cprog >= 1){
      g.cprog = 0; g.cdur = rnd(...d.roll) * rubber(g.score, g.cscore);
      let pts = rint(...d.rollPts); if (Math.random() < .15) pts *= 2;
      g.cscore += pts; g.ccups++;
      const cc = $('#cp-cups'); if (cc) cc.textContent = `완성 ${g.ccups}컵`;
      floatAt($('#cp-fill'), `${HEART}+${pts}`, 'cpu', -30);
      hudScore(g.score, g.cscore); hudPill('c', `${g.ccups}컵`);
      cpuMood('cheer'); if (Math.random() < .5) cpuSay(pick(CH[S.cpu].lines.serve));
    }
    timerTick(g);
    if (g.time <= 0){ g.over = true; finishRound('roll', g); }
  }
  newCust();
  return Object.assign(g, { update, down, move, up, ctrlAct });
}

const HOWTO = {
  order: {
    title:'주문 받기 대결',
    steps:['그릇(컵이나 콘)을 골라요','손님 말풍선과 똑같이 아이스크림을 쌓아요 (아래부터 차례대로!)','토핑이 있으면 토핑도 올려요','다 만들었으면 그 손님을 톡!'],
    tips:'리본 손님은 점수 2배 · 빨리 줄수록 보너스 · 연속으로 맞히면 콤보 보너스 · 기다림 막대가 다 줄면 손님이 가 버려요'
  },
  roll: {
    title:'철판 롤 대결',
    steps:['손님이 원하는 맛을 철판에 부어요','철판을 톡톡 두드려서 다져요','손가락으로 문질러서 넓게 펴요',`바늘이 초록색에 올 때 '돌돌!' ${ROLLS}번`],
    tips:'초록색은 완벽, 노란색은 좋아 · 4개 모두 완벽하면 보너스 · 빨리 완성할수록 보너스 · 리본 손님은 2배'
  }
};

function startMatch(mode){
  S.mode = mode;
  S.queue = mode === 'both' ? ['order','roll'] : [mode];
  S.results = [];
  nextRound();
}
function nextRound(){
  const kind = S.queue.shift();
  show('game'); fit();
  hudInit(kind);
  G = kind === 'order' ? OrderGame() : RollGame();
  const h = HOWTO[kind];
  const roundLabel = S.mode === 'both' ? `${S.results.length + 1}라운드 · ` : '';
  overlay(`<div class="card"><h3>${roundLabel}${h.title}</h3>
    <ol class="howto">${h.steps.map((s, i) => `<li><i>${i + 1}</i><span>${s}</span></li>`).join('')}</ol>
    <div class="tips">${h.tips}</div>
    <button class="btn big" id="btn-go">시작!</button></div>`);
  $('#btn-go').onclick = () => { sfx.tap(); countdown(() => { if (G){ G.running = true; } }); };
}
function countdown(done){
  let n = 3;
  const step = () => {
    if (n > 0){ overlay(`<div class="cd">${n}</div>`); sfx.count(); n--; setTimeout(step, 750); }
    else { overlay(`<div class="cd go">시작!</div>`); sfx.go(); setTimeout(() => { closeOverlay(); done(); }, 600); }
  };
  step();
}
function finishRound(kind, g){
  g.running = false;
  sfx.end();
  overlay(`<div class="cd go">끝!</div>`);
  setTimeout(() => {
    S.results.push({ kind, p:g.score, c:g.cscore });
    G = null;
    if (S.queue.length){
      const P = S.results.reduce((s, r) => s + r.p, 0), C = S.results.reduce((s, r) => s + r.c, 0);
      overlay(`<div class="card"><h3>1라운드 끝!</h3>
        <div class="res-break"><span>${CH[S.player].name} ${g.score}</span><span>${CH[S.cpu].name} ${g.cscore}</span></div>
        <div class="tips">${P === C ? '지금은 동점!' : `지금은 ${CH[P > C ? S.player : S.cpu].name}${P > C ? '(나)' : ''}가 ${Math.abs(P - C)}점 앞서요`} · 다음은 ${HOWTO[S.queue[0]].title}</div>
        <button class="btn big" id="btn-next">다음 대결!</button></div>`);
      $('#btn-next').onclick = () => { sfx.tap(); closeOverlay(); nextRound(); };
    } else { closeOverlay(); showResult(); }
  }, 1300);
}
const KIND_NAME = { order:'주문 받기', roll:'철판 롤' };
function showResult(){
  const P = S.results.reduce((s, r) => s + r.p, 0), C = S.results.reduce((s, r) => s + r.c, 0);
  const win = P > C ? 'p' : C > P ? 'c' : 'd';
  const rec = loadRec();
  if (win === 'p') rec[S.player]++; else if (win === 'c') rec[S.cpu]++; else rec.draw++;
  saveRec(rec);
  const card = (who, score, isWin, tag) => `<div class="res-card ${isWin ? 'win' : ''}">
    ${isWin ? CROWN : ''}
    <div class="rc-girl">${girlSVG(who, win === 'd' ? 'happy' : isWin ? 'cheer' : 'sad')}</div>
    <b>${CH[who].name}</b><small>${tag}</small>
    <div class="rc-score">${HEART}${score}</div></div>`;
  const winner = win === 'p' ? S.player : win === 'c' ? S.cpu : null;
  $('#scr-result').innerHTML = `
    <h2 class="res-h">${win === 'd' ? '무승부! 둘 다 최고 사장님!' : `${CH[winner].name} 승리!`}</h2>
    <div class="res-row">${card(S.player, P, win === 'p', '나')}${card(S.cpu, C, win === 'c', '컴퓨터 · ' + DIFF[S.diff].label)}</div>
    ${S.results.length > 1 ? `<div class="res-break">${S.results.map(r => `<span>${KIND_NAME[r.kind]} ${r.p} : ${r.c}</span>`).join('')}</div>` : ''}
    <div class="res-line">“${win === 'd' ? '우리 둘 다 잘했다!' : CH[winner].lines.win}”</div>
    <div class="nav-row">
      <button class="btn" data-again="1">한 번 더!</button>
      <button class="btn sub" data-go="mode">다른 대결</button>
      <button class="btn sub" data-go="select">사장님 바꾸기</button>
    </div>`;
  show('result');
  if (win === 'p'){ confetti(); sfx.win(); } else if (win === 'd'){ confetti(); sfx.good(); } else { sfx.end(); }
}

function pauseGame(){
  if (!G || !G.running || paused) return;
  paused = true;
  overlay(`<div class="card"><h3>잠깐 멈춤</h3>
    <div class="nav-row"><button class="btn" id="btn-resume">계속하기</button><button class="btn sub" id="btn-quit">그만하기</button></div>
    <button class="btn sub" id="btn-snd2"><span class="snd-label">${muted ? '소리 켜기' : '소리 끄기'}</span></button></div>`);
  $('#btn-resume').onclick = () => { paused = false; closeOverlay(); sfx.tap(); };
  $('#btn-quit').onclick = () => { paused = false; G = null; closeOverlay(); buildMode(); show('mode'); };
  $('#btn-snd2').onclick = toggleSound;
}

/* =========================================================
   입력 연결
   ========================================================= */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){
    sfx.tap();
    const to = go.dataset.go;
    if (to === 'title') buildTitle();
    if (to === 'select') buildSelect();
    if (to === 'mode') buildMode();
    show(to); return;
  }
  const pk = e.target.closest('[data-pick]');
  if (pk){ S.player = pk.dataset.pick; S.cpu = S.player === 'yumin' ? 'somin' : 'yumin'; sfx.pop(); buildSelect(); return; }
  const df = e.target.closest('[data-diff]');
  if (df){ S.diff = df.dataset.diff; sfx.tap(); buildSelect(); return; }
  const md = e.target.closest('[data-mode]');
  if (md){ sfx.tap(); startMatch(md.dataset.mode); return; }
  if (e.target.closest('[data-again]')){ sfx.tap(); startMatch(S.mode); return; }
});
$('#btn-to-mode').addEventListener('click', () => { if (!S.player) return; sfx.tap(); buildMode(); show('mode'); });
$('#btn-sound').addEventListener('click', toggleSound);
$('#btn-pause').addEventListener('click', pauseGame);
if (document.fullscreenEnabled){
  $('#btn-full').hidden = false;
  $('#btn-full').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch(e) {}
    setTimeout(fit, 300);
  });
}

const canPlay = kind => G && G.kind === kind && G.running && !paused && !G.over;
$('#tray').addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-act]'); if (!t || !canPlay('order')) return;
  e.preventDefault(); G.tray(t.dataset.act, t.dataset.val);
});
$('#customers').addEventListener('pointerdown', e => {
  const s = e.target.closest('.slot'); if (!s || !canPlay('order')) return;
  e.preventDefault(); G.serve(+s.dataset.slot);
});
$('#roll-ctrl').addEventListener('pointerdown', e => {
  const t = e.target.closest('[data-act]'); if (!t || !canPlay('roll')) return;
  e.preventDefault(); G.ctrlAct(t.dataset.act, t.dataset.val);
});
const plate = $('#plate');
plate.addEventListener('pointerdown', e => {
  if (!canPlay('roll')) return;
  e.preventDefault();
  try { plate.setPointerCapture(e.pointerId); } catch(err) {}
  const r = plate.getBoundingClientRect();
  G.down((e.clientX - r.left) / scale, (e.clientY - r.top) / scale, e.clientX, e.clientY);
});
plate.addEventListener('pointermove', e => { if (canPlay('roll')) G.move(e.clientX, e.clientY); });
['pointerup','pointercancel'].forEach(t => plate.addEventListener(t, () => { if (G && G.kind === 'roll') G.up(); }));

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ---------- 게임 루프 ---------- */
let last = 0;
function loop(t){
  const dt = last ? Math.min(.05, (t - last) / 1000) : 0;
  last = t;
  if (G && G.running && !paused && !G.over) G.update(dt);
  requestAnimationFrame(loop);
}

/* ---------- 시작 ---------- */
buildTray();
buildTitle();
renderSoundBtn();
fit();
requestAnimationFrame(loop);
})();
</script>
<!--ARTIFACT-BODY-END-->
</body>
</html>
